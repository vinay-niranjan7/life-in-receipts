<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive eight-month digital-life story reconstructed from 53 receipts: patterns, connections and recurring threads.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';">
<title>Life, In Receipts</title>

<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./css/styles.css">
<link rel="stylesheet" href="./css/components.css">
<link rel="stylesheet" href="./css/responsive.css">

<script type="module" src="./js/app.js"></script>
</head>
<body>

<!-- printer reveal: dismissed on timeout, click or any key -->
<div id="intro" aria-hidden="true" data-action="skip-intro">
  <div class="intro-strip">
    <div class="eyebrow">— PRINTING RECORD —</div>
    <div class="intro-title">LIFE, IN RECEIPTS</div>
    <div class="sub">small records can reveal a bigger story</div>
    <div class="barcode"></div>
  </div>
</div>

<a class="skip-link" href="#main">Skip to content</a>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1 class="mark">🧾 Life, In Receipts</h1>
      <span class="strap">eight months, reconstructed from fifty-three small records</span>
    </div>
    <button class="icon-btn wide" id="surpriseBtn" data-action="surprise" title="Surprise me" aria-label="Surprise me: jump to a connected moment">✦<span class="btxt">Surprise me</span></button>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle light and dark theme">☾</button>
  </div>
  <!-- tabs: The Story / Patterns / Explore / Life Map (rendered by js/ui.js) -->
  <nav class="tabs" id="tabs" aria-label="Primary navigation"></nav>
</header>

<p id="live" class="sr-only" role="status" aria-live="polite"></p>

<!-- active view is rendered here by js/app.js -->
<main id="main" tabindex="-1">
  <noscript><div class="empty-state">JavaScript is required to explore the interactive story.</div></noscript>
</main>

<footer class="site">A fictional dataset, reconstructed into an interactive story. No backend or personal data collection is used.</footer>

</body>
</html>
